# RAFEEQ — nginx inside the container.
#
# `__PORT__` is replaced by the entrypoint with whatever the platform injected as $PORT. A
# hard-coded port is the single most common reason a container builds fine and then reports
# "Application failed to respond": the platform's edge connects to a port nothing is listening on.

user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs to the container's stdout, because that is where the platform reads them from. A file
    # inside a container nobody can open is not a log.
    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 12M;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;

    server {
        listen __PORT__ default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;

        charset utf-8;
        charset_types text/plain text/css application/json application/javascript;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 60s;
        }

        # 🔒 Nothing under these is ever served. `storage` holds identity documents and GPS
        # trails; one misconfigured path here is the whole privacy model gone. The document root
        # is already `public/`, so this is belt and braces — and worth it for exactly that reason.
        location ~ ^/(storage|bootstrap|config|database|resources|routes|tests|vendor)/ {
            deny all;
            return 404;
        }

        location ~ /\.(?!well-known).* {
            deny all;
            return 404;
        }

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
