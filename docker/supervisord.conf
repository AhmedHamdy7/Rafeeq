# RAFEEQ — the processes inside the web container.
#
# 🔴 Only nginx and php-fpm. The queue worker, Reverb and the scheduler are deliberately NOT here,
# even though putting them in would look convenient:
#
#   - a queue worker in the web container is restarted by every deploy and scaled by every replica,
#     so two replicas process each job twice
#   - the scheduler likewise: two containers means `commutes:generate-trips` runs twice a night
#   - and if any of them crashes the container, the API goes down with it
#
# They are separate services, each with its own start command. See deploy/RAILWAY_SETUP.md §5 or
# deploy/systemd/ for a VM.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
# php-fpm must be up before nginx accepts traffic, or the first requests are 502s.
priority=10

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
