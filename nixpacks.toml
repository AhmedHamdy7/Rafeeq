# Build configuration for Nixpacks (Railway, Coolify, and anything else using it).
#
# 🔴 PHP only. Nixpacks detects `package.json` and adds a whole Node phase — install,
# build, prune — and on a small builder the prune step gets OOM-killed with exit 137.
# That is the first error this file existed to remove.
#
# And it removes it by not doing the work, rather than by finding more memory, because
# the work buys nothing. This project is an API plus a Livewire dashboard:
#
#   - the API returns JSON and has no assets at all
#   - the dashboard loads `public/css/admin.css`, a hand-written file that is committed
#     to the repo and needs no bundler (see resources/views/components/layouts/admin)
#
# The only thing that ever needed Vite was Laravel's default landing page, and that is
# not part of the product. `routes/web.php` now serves a page with no assets instead.
#
# ⚠️ If a real front-end is ever added — a marketing site, a Blade app with Tailwind —
# delete this file and fix the memory instead. Leaving it in place would silently ship
# an unbuilt asset bundle.
#
# ---
#
# 🔴 What is deliberately NOT here any more, and why it matters more than what is.
#
# This file first also carried `[phases.build] cmds = []`, meaning "there is nothing to
# build". That looked harmless and broke the deployment: the PHP provider's BUILD phase
# is where it generates the nginx config and the start script that binds to `$PORT`.
# Emptying it produced a container that started and listened on nothing, which Railway
# reports as "Application failed to respond" — an error that says nothing about a build
# step, because by then the build had succeeded.
#
# The lesson is narrow and worth keeping: `providers = ["php"]` is already enough to
# suppress Node entirely. Overriding a provider's phase to say "do nothing" also throws
# away whatever else that phase was doing for you.
providers = ["php"]

[phases.install]
# 🔴 `--no-dev`. Without it the builder installs pest, paratest and larastan onto a
# production image — and paratest requires PHP 8.4/8.5 in a way that made the install
# fail outright against a lock file resolved elsewhere.
#
# Safe to override because this phase does one thing. It only works at all because
# `dedoc/scramble` moved from `require-dev` to `require`: it is imported by
# `app/Http/OpenApi` and called in `AppServiceProvider::boot()`, so a `--no-dev`
# install used to fatal on every request. That was a real production bug, and this
# build failing is what found it.
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]
