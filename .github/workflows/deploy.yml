# Deploys to the VPS (153.79.251.111). One branch per environment, same server:
#
#   branch    environment  URL                  folder
#   main      production   api.yugoeg.com       /var/www/rafeeq
#   staging   staging      staging.yugoeg.com   /var/www/rafeeq-staging
#
# A push to either branch → tests.yml (Pint + Pest on MySQL 8) → if green, deploy the exact commit
# that was tested to that branch's environment. A red run never deploys.
#
# Usual flow: work on `staging`, check it on staging.yugoeg.com, then open a PR staging → main and
# merge it to release to production.
#
# Re-deploy by hand (e.g. after fixing something on the server): Actions → deploy → Run workflow.
# It also refuses a commit tests.yml has not passed on.
#
# Repository secrets (Settings → Secrets and variables → Actions), shared by both:
#   DEPLOY_HOST          153.79.251.111
#   DEPLOY_USER          deploy
#   DEPLOY_SSH_KEY       private key whose public half is in ~deploy/.ssh/authorized_keys
#   DEPLOY_KNOWN_HOSTS   output of `ssh-keyscan <host>`, so the runner refuses a server that is
#                        not ours instead of trusting whatever answers on that IP
name: deploy

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging
      ref:
        description: Branch, tag or commit SHA (tests must have passed on it). Empty = the environment's own branch.
        type: string
        default: ''

permissions:
  contents: read
  actions: read

env:
  # workflow_run: the branch that was pushed decides. workflow_dispatch: the choice made.
  TARGET: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.environment
        || (github.event.workflow_run.head_branch == 'main' && 'production' || 'staging') }}

jobs:
  deploy:
    # `event == 'push'`: tests.yml also runs on pull requests; only a push to the branch deploys.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'production' || 'staging') }}

    # One deploy per environment at a time, and never cancel one half-way through a migration.
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'production' || 'staging') }}
      cancel-in-progress: false

    steps:
      - name: Resolve commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REF: ${{ inputs.ref }}
        run: |
          if [ -n "$RUN_SHA" ]; then
            # The commit tests.yml actually passed on — not whatever the branch is by now.
            sha="$RUN_SHA"
          else
            if [ -z "$REF" ]; then
              [ "$TARGET" = production ] && REF=main || REF=staging
            fi
            sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)"
            # A manual deploy must not skip the gate the automatic one has.
            passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?head_sha=$sha&status=success" --jq .total_count)"
            if [ "$passed" = "0" ]; then
              echo "::error::tests.yml has not passed on $sha ($REF). Push it to staging or open a PR so the tests run first."
              exit 1
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha to $TARGET"

      # Checks each secret's SHAPE (never prints a value) and says exactly which one is wrong.
      # `::error::` lines become annotations on the run, readable without opening the log.
      - name: Check secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          bad=0
          host="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          user="$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')"
          [ -n "$host" ] || { echo "::error::Secret DEPLOY_HOST is missing or empty."; bad=1; }
          [ -z "$host" ] || printf '%s' "$host" | grep -Eq '^[0-9a-zA-Z.-]+$' || { echo "::error::Secret DEPLOY_HOST should be just the IP (153.79.251.111), with nothing else."; bad=1; }
          [ "$host" = "$DEPLOY_HOST" ] || echo "::warning::Secret DEPLOY_HOST has spaces or a line break around it (ignored, but worth cleaning)."
          [ -n "$user" ] || { echo "::error::Secret DEPLOY_USER is missing or empty (should be: deploy)."; bad=1; }
          printf '%s' "$DEPLOY_SSH_KEY" | grep -q 'BEGIN OPENSSH PRIVATE KEY' || { echo "::error::Secret DEPLOY_SSH_KEY is missing, or does not start with -----BEGIN OPENSSH PRIVATE KEY-----."; bad=1; }
          printf '%s' "$DEPLOY_SSH_KEY" | grep -q 'END OPENSSH PRIVATE KEY' || { echo "::error::Secret DEPLOY_SSH_KEY is cut short: the -----END OPENSSH PRIVATE KEY----- line is missing."; bad=1; }
          printf '%s' "$DEPLOY_KNOWN_HOSTS" | grep -Eq '(ssh-ed25519|ecdsa-sha2|ssh-rsa) ' || { echo "::error::Secret DEPLOY_KNOWN_HOSTS is missing, or has no key line (each line looks like: 153.79.251.111 ssh-ed25519 AAAA...)."; bad=1; }
          echo "DEPLOY_HOST=$host" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$user" >> "$GITHUB_ENV"
          exit $bad

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # Pasted through a browser, a key can arrive with Windows line endings — ssh refuses those.
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1 || { echo "::error::Secret DEPLOY_SSH_KEY is not a readable private key (copied incompletely?)."; exit 1; }

      - name: Deploy
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          case "$TARGET" in
            production) dir=/var/www/rafeeq ;;
            staging)    dir=/var/www/rafeeq-staging ;;
            *) echo "unknown environment $TARGET"; exit 1 ;;
          esac
          # DEPLOY_HOST / DEPLOY_USER come trimmed from "Check secrets".
          set +e
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash $dir/deploy/deploy.sh $SHA" 2> >(tee /tmp/ssh-err >&2)
          code=$?
          if [ $code -ne 0 ]; then
            # The first lines of what went wrong, as an annotation (no secret is ever in them).
            echo "::error::Deploy to $TARGET failed (exit $code): $(head -c 600 /tmp/ssh-err | tr '\n' ' ')"
          fi
          exit $code
