# RAFEEQ — nginx site
#
# Copy to /etc/nginx/sites-available/rafeeq, symlink into sites-enabled, then
# `certbot --nginx -d api.example.com` which rewrites the TLS half of this file.
#
# 🔒 The security headers here are not decoration. Two of them matter specifically:
# `X-Robots-Tag: noindex` on a live-share page (Bible §group ⑫) and `no-store` on
# anything that can carry a document URL — both are rules the product depends on and
# neither can be enforced from PHP once a proxy is caching in front of it.

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Certbot replaces this block; until then it serves plain HTTP so you can
    # verify the app works before adding TLS.
    root /var/www/rafeeq/public;
    index index.php;

    charset utf-8;

    # The app speaks Arabic. Without this, error pages and any plain-text
    # response arrive in the browser's guessed encoding.
    charset_types text/plain text/css application/json application/javascript;

    client_max_body_size 12M;   # documents are capped at 8 MB in config; leave headroom

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # A long-polling or slow provider call must not be cut off mid-transaction.
        fastcgi_read_timeout 60s;
    }

    # 🔒 Nothing under these is ever served. `storage` holds identity documents and
    # GPS trails; a single misconfigured alias here is the whole privacy model gone.
    location ~ ^/(storage|bootstrap|config|database|resources|routes|tests|vendor)/ {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # 🔒 Reverb (live trip positions) proxied under the same host, so the mobile app
    # needs one origin and TLS terminates once.
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # a WebSocket on a commute is open for an hour
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;

    access_log /var/log/nginx/rafeeq-access.log;
    error_log  /var/log/nginx/rafeeq-error.log;
}
